<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G10 MetaTrade Bot - پلتفرم هوشمند یعقوبی ترید</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Vazirmatn', sans-serif; background-color: #07090e; color: #f1f5f9; }
    .gold-gradient { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
    .gold-text { background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .glow-gold { box-shadow: 0 0 15px rgba(245, 158, 11, 0.25); }
    .glow-green { box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); }
    .glow-red { box-shadow: 0 0 15px rgba(239, 68, 68, 0.3); }
  </style>
</head>
<body class="flex flex-col min-h-screen justify-between pb-24">

  <!-- Header -->
  <header class="bg-slate-900/90 backdrop-blur-md border-b border-amber-500/20 p-4 sticky top-0 z-50">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-2 space-x-reverse">
        <div class="w-9 h-9 rounded-xl gold-gradient flex items-center justify-center font-bold text-slate-950 shadow-md">YQT</div>
        <div>
          <h1 class="font-bold text-sm text-slate-100 flex items-center gap-1">
            G10 MetaTrade Bot <span class="text-[10px] bg-amber-500/10 text-amber-400 border border-amber-500/30 px-1.5 py-0.5 rounded">PRO</span>
          </h1>
          <p class="text-xs text-slate-400">پلتفرم هوشمند ۱ دقیقه‌ای</p>
        </div>
      </div>
      <div class="text-left">
        <p class="text-[11px] text-slate-400">موجودی حساب</p>
        <p class="text-sm font-bold gold-text font-mono"><span id="user-balance">136.80</span> YQT</p>
      </div>
    </div>
  </header>

  <!-- DASHBOARD -->
  <main id="view-dashboard" class="max-w-md mx-auto w-full p-4 space-y-4 flex-1">
    <div id="active-trade-box" class="hidden bg-slate-900 border border-amber-500/50 rounded-2xl p-3 text-xs space-y-1 glow-gold">
      <div class="flex justify-between font-bold text-amber-400">
        <span>⚡ معامله فعال ۱ دقیقه‌ای</span>
        <span id="trade-timer" class="font-mono">60s</span>
      </div>
      <div class="flex justify-between text-slate-300">
        <span>نوع: <b id="trade-type">-</b></span>
        <span>ورود: $<span id="trade-entry">-</span></span>
        <span>مبلغ: <span id="trade-amount-val">-</span> YQT</span>
      </div>
    </div>

    <!-- Multi-Pair Selector -->
    <div class="flex gap-2 overflow-x-auto pb-1 text-xs no-scrollbar">
      <button onclick="switchPair('bitcoin', 'BTC/USDT')" id="btn-bitcoin" class="px-3 py-2 rounded-xl bg-amber-500 text-slate-950 font-bold border border-amber-400 whitespace-nowrap shadow-sm">BTC/USDT</button>
      <button onclick="switchPair('ethereum', 'ETH/USDT')" id="btn-ethereum" class="px-3 py-2 rounded-xl bg-slate-900 text-slate-300 border border-slate-800 whitespace-nowrap">ETH/USDT</button>
      <button onclick="switchPair('solana', 'SOL/USDT')" id="btn-solana" class="px-3 py-2 rounded-xl bg-slate-900 text-slate-300 border border-slate-800 whitespace-nowrap">SOL/USDT</button>
      <button onclick="switchPair('binancecoin', 'BNB/USDT')" id="btn-binancecoin" class="px-3 py-2 rounded-xl bg-slate-900 text-slate-300 border border-slate-800 whitespace-nowrap">BNB/USDT</button>
    </div>

    <!-- Chart -->
    <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 shadow-lg backdrop-blur">
      <div class="flex justify-between items-center mb-2">
        <span id="pair-title" class="font-bold text-slate-200">BTC/USDT</span>
        <span id="live-price" class="font-mono font-bold text-lg text-emerald-400">در حال دریافت...</span>
      </div>
      <div class="relative h-48 w-full">
        <canvas id="tradingChart"></canvas>
      </div>
    </div>

    <!-- AI Signal Box -->
    <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 flex items-center justify-between">
      <div class="flex items-center space-x-2 space-x-reverse">
        <span class="relative flex h-3 w-3">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
        </span>
        <span class="text-xs font-semibold text-slate-300">سیگنال هوش مصنوعی (G10):</span>
      </div>
      <span id="ai-signal" class="px-3 py-1 rounded-lg text-xs font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">ANALYZING...</span>
    </div>

    <!-- Action Buttons -->
    <div class="grid grid-cols-2 gap-3">
      <button id="btn-high" onclick="placeTrade('HIGH')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-2xl flex items-center justify-center space-x-2 space-x-reverse shadow-lg glow-green active:scale-95 transition">
        <span>خرید (High) 📈</span>
      </button>
      <button id="btn-low" onclick="placeTrade('LOW')" class="bg-rose-600 hover:bg-rose-500 text-white font-bold py-3.5 rounded-2xl flex items-center justify-center space-x-2 space-x-reverse shadow-lg glow-red active:scale-95 transition">
        <span>فروش (Low) 📉</span>
      </button>
    </div>

    <!-- Controls -->
    <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 space-y-3">
      <div class="grid grid-cols-2 gap-2 text-xs">
        <div>
          <label class="block text-slate-400 mb-1">مبلغ معامله (YQT):</label>
          <select id="trade-amount" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200">
            <option value="10">YQT 10</option>
            <option value="25">YQT 25</option>
            <option value="50">YQT 50</option>
            <option value="100">YQT 100</option>
          </select>
        </div>
        <div>
          <label class="block text-slate-400 mb-1">استراتژی ربات:</label>
          <select class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200">
            <option>Scalp AI Pro</option>
          </select>
        </div>
      </div>
      <div class="text-center pt-1">
        <p class="text-[11px] text-slate-400">سیگنال بعدی در:</p>
        <p id="timer" class="text-xl font-mono font-bold text-amber-400">00:60</p>
      </div>
    </div>
  </main>

  <script>
    let currentCoin = 'bitcoin';
    let prices = [];
    let chart;
    let balance = 136.80;
    let activeTrade = null;
    let currentPrice = 0;

    const ctx = document.getElementById('tradingChart').getContext('2d');
    chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: Array(15).fill(''),
        datasets: [{
          data: [],
          borderColor: '#f59e0b',
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.2,
          fill: true,
          backgroundColor: 'rgba(245, 158, 11, 0.08)'
        }]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { grid: { color: '#1e293b' } } } }
    });

    async function fetchPrice() {
      try {
        const response = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${currentCoin}&vs_currencies=usd`);
        const data = await response.json();
        currentPrice = parseFloat(data[currentCoin].usd);
        document.getElementById('live-price').innerText = '$' + currentPrice.toFixed(2);
        prices.push(currentPrice);
        if (prices.length > 15) prices.shift();
        chart.data.datasets[0].data = prices;
        chart.update('none');
      } catch (e) {
        currentPrice = 91200 + Math.random() * 100;
        document.getElementById('live-price').innerText = '$' + currentPrice.toFixed(2);
      }
    }

    function switchPair(coin, title) {
      currentCoin = coin;
      document.getElementById('pair-title').innerText = title;
      prices = [];
      fetchPrice();
    }

    setInterval(fetchPrice, 3000);
    fetchPrice();
  </script>
</body>
</html>
